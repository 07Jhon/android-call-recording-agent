version: '3.8'

services:
  # 🔴 PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: call-recording-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: call_recordings
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - call-recording-network

  # 🔵 Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: call-recording-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/call_recordings
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - call-recording-network
    volumes:
      - backend_logs:/logs

  # 🟢 React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: call-recording-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - call-recording-network

  # 🟡 Adminer (Database GUI)
  adminer:
    image: adminer:latest
    container_name: call-recording-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - call-recording-network

volumes:
  postgres_data:
  backend_logs:

networks:
  call-recording-network:
    driver: bridge
